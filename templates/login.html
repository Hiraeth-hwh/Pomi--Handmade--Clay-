{% extends 'base.html'%}
{% load static %}
{% block content %}

<header class="btn-pastel-pink py-5">
    <div class="container px-4 px-lg-5 my-5 " >
        <div class="text-center text-dark">
            <h1 class="display-4 fw-bolder " >Login Page</h1>
            <p class="lead fw-normal text-dark-50 mb-0">Login To Your Account</p>
        </div>
    </div>
</header>
<div class="container">
    <div class="row">
        <center>
            <div class="col-8">
                <br><br>
                <form method="POST" action="{% url 'login' %}">
                    {% csrf_token %}
                    <div class="mb-3">

                        <input type="text" class="form-control" name="username" placeholder="Enter your username">

                    </div>
                    <div class="mb-3">

                        <input type="password" class="form-control" name="password" placeholder="Enter your password">
                    </div>

                    <button  href="{% url 'login'%}"type="submit" class="btn btn-secondary">Login</button>
                </form>
                <br>
                </form>
                <br><br>
                <br><br>
                
            </div>
        </center>
    </div>
</div>
</div>
</div>
{% endblock %}
