{% extends 'base.html'%}
{% load static %}
{% block content %}



<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0 rounded-4 p-4 bg-white">
                <h2 class="text-center fw-bold mb-4" style="color: #4A4A4A;">Contact Us</h2>

                <form action="{% url 'contact' %}" method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email</label>
                        <input type="email" name="email" class="form-control" placeholder="Your Email" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Name</label>
                        <input type="text" name="name" class="form-control" placeholder="Your Name" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Phone Number</label>
                        <input type="text" name="phone" class="form-control" placeholder="Enter your phone number"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Message</label>
                        <textarea name="message" class="form-control" rows="4" placeholder="Type your message here..."
                            required></textarea>
                    </div>

                    <button type="submit" class="btn w-100 fw-bold text-white py-2"
                        style="background-color: #8fa881; border-radius: 8px;">
                        Send Message
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
